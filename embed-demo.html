<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23b9701a'/%3E%3C/svg%3E"><title>等高线嵌入示例</title>
<style>body{margin:0;background:#0b0d0e;color:#e8e6e2;font:14px/1.6 system-ui;display:grid;place-items:center;min-height:100vh}.panel{width:min(90vw,520px);height:620px;border:1px solid #2a2f36;background:#12151a;overflow:hidden}.content{position:relative;z-index:1;padding:38px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#b9701a}h1{font-size:30px;font-weight:500;margin:22px 0}.metric{font:62px Consolas,monospace;margin:70px 0 0}.note{color:#8b939c}button{position:relative;z-index:1;margin:25px 38px;background:none;border:1px solid #b9701a;color:#e8e6e2;padding:10px 16px;cursor:pointer}</style>
<article class="panel" id="panel" data-motion="off"><div class="content"><div class="eyebrow">CONTOUR / FIELD</div><h1>运行概览</h1><div class="metric">32</div><div class="note">单模块、可暂停、可销毁的背景示例</div></div><button id="toggle">播放背景</button></article>
<script type="module">import { mountContourBackground } from './embed-background.mjs';
const panel=document.getElementById('panel'); const background=mountContourBackground(panel,{field:{seed:721,bands:34},style:{background:'#12151a',color:'#b8bdbb',alpha:.12,edgeFade:.16}});
background.renderAt(12); const toggle=document.getElementById('toggle'); toggle.onclick=()=>{if(panel.dataset.motion==='off'){panel.dataset.motion='on';background.start();toggle.textContent='暂停背景';}else{panel.dataset.motion='off';background.stop();toggle.textContent='播放背景';}};
window.embeddedContour=background;</script></html>
